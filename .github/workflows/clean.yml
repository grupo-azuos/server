name: ansible-clean
run-name: ansible-clean ${{ inputs.server }} ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Servidor alvo (homo é manual, pelo painel do Coolify)'
        required: true
        default: 'ops'
        type: choice
        options:
          - ops
          - core
          - crm
          - auto
      target:
        description: 'Serviço para parar e remover'
        required: true
        default: 'prometheus-grafana'
        type: choice
        options:
          - prometheus-grafana
          - node-exporter-cadvisor
          - komodo-core
          - komodo-periphery
          - caddy
          - cockpit
          - netbird-client
          - netbird
      remove_volumes:
        description: 'Apagar volumes de dados persistentes?'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Modo simulação (--check)?'
        required: false
        default: false
        type: boolean

jobs:
  clean:
    name: ansible-clean ${{ github.event.inputs.server }} ${{ github.event.inputs.target }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.server }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        env:
          TARGET_SERVER: ${{ github.event.inputs.server }}
          ENV_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ENV_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          OPS_KEY: ${{ secrets.OPS_SSH_PRIVATE_KEY }}
          CORE_KEY: ${{ secrets.CORE_SSH_PRIVATE_KEY }}
          CRM_KEY: ${{ secrets.CRM_SSH_PRIVATE_KEY }}
          AUTO_KEY: ${{ secrets.AUTO_SSH_PRIVATE_KEY }}
          OPS_PASSPHRASE: ${{ secrets.OPS_SSH_PASSPHRASE }}
          CORE_PASSPHRASE: ${{ secrets.CORE_SSH_PASSPHRASE }}
          CRM_PASSPHRASE: ${{ secrets.CRM_SSH_PASSPHRASE }}
          AUTO_PASSPHRASE: ${{ secrets.AUTO_SSH_PASSPHRASE }}
        run: |
          SSH_KEY="$ENV_SSH_KEY"
          if [ -z "$SSH_KEY" ]; then
            var="${TARGET_SERVER^^}_KEY"
            SSH_KEY="${!var}"
          fi

          PASSPHRASE="$ENV_PASSPHRASE"
          if [ -z "$PASSPHRASE" ]; then
            var="${TARGET_SERVER^^}_PASSPHRASE"
            PASSPHRASE="${!var}"
          fi

          if [ -z "$SSH_KEY" ]; then
            echo "::error::Chave SSH não encontrada para o servidor '$TARGET_SERVER'! Cadastre 'SSH_PRIVATE_KEY' no Environment ou '${TARGET_SERVER^^}_SSH_PRIVATE_KEY' nas Secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          eval $(ssh-agent -s)
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          # Normaliza quebras de linha literais caso a secret tenha sido salva com "\n" ou com CRLF
          if echo "$SSH_KEY" | grep -q '\\n'; then
            SSH_KEY=$(printf '%b' "$SSH_KEY")
          fi

          printf '%s\n' "$SSH_KEY" | tr -d '\r' > /tmp/id_ci
          chmod 600 /tmp/id_ci

          if ! grep -q -- "-----BEGIN" /tmp/id_ci; then
            echo "::error::A chave SSH fornecida não é uma chave privada válida (falta o cabeçalho '-----BEGIN ...')! Verifique se você não copiou a chave pública (.pub) por engano."
            rm -f /tmp/id_ci
            exit 1
          fi

          export PASSPHRASE
          if [ -n "$PASSPHRASE" ]; then
            printf '#!/bin/sh\nexec printf "%%s\\n" "$PASSPHRASE"\n' > /tmp/ssh_askpass
            chmod 700 /tmp/ssh_askpass
            if ! DISPLAY=None SSH_ASKPASS=/tmp/ssh_askpass SSH_ASKPASS_REQUIRE=force ssh-add /tmp/id_ci; then
              echo "::error::Falha ao desbloquear a chave SSH com a passphrase! Verifique a secret 'SSH_PASSPHRASE'."
              rm -f /tmp/ssh_askpass /tmp/id_ci
              exit 1
            fi
            rm -f /tmp/ssh_askpass
          else
            if ! ssh-add /tmp/id_ci; then
              echo "::error::Falha ao carregar a chave SSH! Se ela tem passphrase, cadastre a secret 'SSH_PASSPHRASE'."
              rm -f /tmp/id_ci
              exit 1
            fi
          fi
          rm -f /tmp/id_ci

          echo "Chave SSH carregada com sucesso:"
          ssh-add -l

      # Com o SSH fechado no firewall, o runner entra na VPN com uma Setup Key efêmera
      # e os hosts.ini das secrets usam o IP do NetBird de cada servidor.
      - name: Entrar no NetBird (se NETBIRD_CI_SETUP_KEY existir)
        env:
          NETBIRD_CI_SETUP_KEY: ${{ secrets.NETBIRD_CI_SETUP_KEY }}
        run: |
          if [ -z "$NETBIRD_CI_SETUP_KEY" ]; then
            echo "Sem NETBIRD_CI_SETUP_KEY: SSH pelo IP público."
            exit 0
          fi
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          sudo netbird up --management-url https://netbird.grupoazuos.com.br \
            --setup-key "$NETBIRD_CI_SETUP_KEY" --hostname "gha-${{ github.run_id }}"
          sudo netbird status

      - name: Instalar Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      # Como no my-config: o hosts.ini do alvo vem do Environment (ANSIBLE_HOSTS_INI) ou da
      # secret <SERVIDOR>_ANSIBLE_HOSTS_INI. Os outros servidores vêm só das secrets com prefixo
      # (Environment de outro servidor não é visível aqui): o Prometheus lista os monitorados e o
      # agente do Komodo procura o Core. O --limit restringe onde o playbook roda.
      - name: Configurar inventários (hosts.ini)
        env:
          TARGET_SERVER: ${{ github.event.inputs.server }}
          ENV_HOSTS_INI: ${{ secrets.ANSIBLE_HOSTS_INI || secrets.HOSTS_INI }}
          OPS_HOSTS: ${{ secrets.OPS_ANSIBLE_HOSTS_INI }}
          CORE_HOSTS: ${{ secrets.CORE_ANSIBLE_HOSTS_INI }}
          CRM_HOSTS: ${{ secrets.CRM_ANSIBLE_HOSTS_INI }}
          AUTO_HOSTS: ${{ secrets.AUTO_ANSIBLE_HOSTS_INI }}
        run: |
          for s in ops core crm auto; do
            var="${s^^}_HOSTS"
            content="${!var}"
            if [ "$s" = "$TARGET_SERVER" ] && [ -n "$ENV_HOSTS_INI" ]; then
              content="$ENV_HOSTS_INI"
            fi
            if [ -n "$content" ]; then
              printf '%s\n' "$content" | tr -d '\r' > "configuration/servers/v1.0.1/$s/hosts.ini"
              chmod 600 "configuration/servers/v1.0.1/$s/hosts.ini"
              echo "hosts.ini de $s configurado"
            fi
          done

          if [ ! -f "configuration/servers/v1.0.1/${TARGET_SERVER}/hosts.ini" ]; then
            echo "::error::Nenhum inventário para '${TARGET_SERVER}'! Cadastre 'ANSIBLE_HOSTS_INI' no Environment ou '${TARGET_SERVER^^}_ANSIBLE_HOSTS_INI' nas Secrets."
            exit 1
          fi

      - name: Executar Playbook de Limpeza (clean.yml)
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "True"
          TARGET_SERVER: ${{ github.event.inputs.server }}
          TARGET: ${{ github.event.inputs.target }}
          REMOVE_VOLUMES: ${{ github.event.inputs.remove_volumes }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ENV_BECOME_PASS: ${{ secrets.ANSIBLE_BECOME_PASSWORD || secrets.BECOME_PASSWORD }}
          OPS_BECOME_PASS: ${{ secrets.OPS_ANSIBLE_BECOME_PASSWORD }}
          CORE_BECOME_PASS: ${{ secrets.CORE_ANSIBLE_BECOME_PASSWORD }}
          CRM_BECOME_PASS: ${{ secrets.CRM_ANSIBLE_BECOME_PASSWORD }}
          AUTO_BECOME_PASS: ${{ secrets.AUTO_ANSIBLE_BECOME_PASSWORD }}
        run: |
          BECOME_PASS="$ENV_BECOME_PASS"
          if [ -z "$BECOME_PASS" ]; then
            var="${TARGET_SERVER^^}_BECOME_PASS"
            BECOME_PASS="${!var}"
          fi

          EXTRA_VARS=""
          export BECOME_PASS
          if [ -n "$BECOME_PASS" ]; then
            umask 077
            BECOME_PASS="$BECOME_PASS" python3 -c 'import json, os; json.dump({"ansible_become_password": os.environ["BECOME_PASS"]}, open("/tmp/become.json", "w"))'
            EXTRA_VARS="--extra-vars @/tmp/become.json"
          fi
          trap 'rm -f /tmp/become.json' EXIT

          CHECK_ARG=""
          if [ "$DRY_RUN" = "true" ]; then
            CHECK_ARG="--check"
          fi

          ansible-playbook configuration/ansible/clean.yml \
            --tags "$TARGET" --limit "$TARGET_SERVER" \
            -e remove_volumes="$REMOVE_VOLUMES" $CHECK_ARG $EXTRA_VARS

      - name: Sair do NetBird
        if: always()
        run: |
          if command -v netbird >/dev/null; then
            sudo netbird down || true
          fi
