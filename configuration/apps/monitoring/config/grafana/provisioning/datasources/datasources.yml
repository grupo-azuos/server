apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # PROMETHEUS_URL e LOKI_URL vêm do compose (IP do ops na VPN)
    url: $PROMETHEUS_URL
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: $LOKI_URL
    editable: true
