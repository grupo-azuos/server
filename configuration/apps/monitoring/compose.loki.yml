# Loki (logs de todos os servidores), só no ops (/opt/loki).
# Rede do host e escuta só no IP da VPN (VPN_IP); o Alloy de cada servidor envia para cá.
services:
  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped
    network_mode: host
    command:
      - "-config.file=/etc/loki/loki.yml"
      - "-config.expand-env=true"
    environment:
      - VPN_IP=${VPN_IP:?}
    volumes:
      - ./config/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

volumes:
  loki-data:
    name: loki-data
