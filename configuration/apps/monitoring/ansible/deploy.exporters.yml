---
# =========================================================================
# === EXPORTERS (NODE EXPORTER + CADVISOR) ===
# =========================================================================
# Em todo servidor do grupo `monitorados`. Escutam só no IP do NetBird.

- name: "[node-exporter-cadvisor] IP do NetBird"
  include_tasks: "{{ playbook_dir }}/tasks/vpn_ip.yml"
  tags: [node-exporter-cadvisor]

- name: "[node-exporter-cadvisor] Criar diretório de deploy"
  file:
    path: "{{ exporters_path }}"
    state: directory
    mode: '0755'
  tags: [node-exporter-cadvisor]

- name: "[node-exporter-cadvisor] Copiar docker-compose"
  copy:
    src: "{{ apps_dir }}/monitoring/compose.exporters.yml"
    dest: "{{ exporters_path }}/docker-compose.yml"
    mode: '0644'
  tags: [node-exporter-cadvisor]

- name: "[node-exporter-cadvisor] Criar .env com o IP do NetBird"
  copy:
    dest: "{{ exporters_path }}/.env"
    content: |
      VPN_IP={{ vpn_ip }}
    mode: '0644'
  tags: [node-exporter-cadvisor]

- name: "[node-exporter-cadvisor] Subir node-exporter e cAdvisor"
  command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ exporters_path }}"
  tags: [node-exporter-cadvisor]

- name: "[node-exporter-cadvisor] Conferir node-exporter na VPN"
  uri:
    url: "http://{{ vpn_ip }}:9100/metrics"
    return_content: no
  register: node_exporter_check
  retries: 10
  delay: 3
  until: node_exporter_check.status == 200
  tags: [node-exporter-cadvisor]
