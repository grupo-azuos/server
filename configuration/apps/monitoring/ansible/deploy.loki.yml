---
# =========================================================================
# === LOKI (LOGS) ===
# =========================================================================
# Só no ops. Recebe os logs do Alloy de cada servidor; o Grafana lê daqui.

- name: "[loki] IP do NetBird"
  include_tasks: "{{ playbook_dir }}/tasks/vpn_ip.yml"
  tags: [loki]

- name: "[loki] Criar diretórios"
  file:
    path: "{{ loki_path }}/config"
    state: directory
    mode: '0755'
  tags: [loki]

- name: "[loki] Copiar docker-compose e loki.yml"
  copy:
    src: "{{ apps_dir }}/monitoring/{{ item.src }}"
    dest: "{{ loki_path }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: compose.loki.yml, dest: docker-compose.yml }
    - { src: config/loki/loki.yml, dest: config/loki.yml }
  register: loki_files
  tags: [loki]

- name: "[loki] Criar .env"
  copy:
    dest: "{{ loki_path }}/.env"
    content: |
      VPN_IP={{ vpn_ip }}
    mode: '0644'
  register: loki_env
  tags: [loki]

- name: "[loki] Subir Loki"
  command: docker compose up -d --remove-orphans {{ '--force-recreate' if (loki_files.changed or loki_env.changed) else '' }}
  args:
    chdir: "{{ loki_path }}"
  tags: [loki]

- name: "[loki] Conferir Loki pronto"
  uri:
    url: "http://{{ vpn_ip }}:3100/ready"
  register: loki_check
  retries: 20
  delay: 3
  until: loki_check.status == 200
  tags: [loki]
