---
# =========================================================================
# === NETBIRD SERVER (direto no Docker) ===
# Publicado pelo Caddy do servidor (grupo caddy) ou, no prod, pelo Traefik do Coolify.
# =========================================================================

- name: "[netbird] Criar diretórios de deploy do NetBird"
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ netbird_path }}"
    - "{{ netbird_path }}/data"
  tags: [netbird]

- name: "[netbird] Quem publica: Caddy do servidor ou Traefik do Coolify"
  set_fact:
    netbird_on_caddy: "{{ inventory_hostname in groups['caddy'] | default([]) }}"
  tags: [netbird]

- name: "[netbird] Conferir Caddy no ar (rode a etapa caddy antes)"
  command: docker inspect caddy
  changed_when: false
  when: netbird_on_caddy
  tags: [netbird]

- name: "[netbird] Copiar docker-compose do NetBird"
  copy:
    src: "{{ apps_dir }}/netbird/{{ 'compose.caddy.yml' if netbird_on_caddy else 'compose.yml' }}"
    dest: "{{ netbird_path }}/docker-compose.yml"
    mode: '0644'
  tags: [netbird]

- name: "[netbird] Criar .env do compose"
  copy:
    dest: "{{ netbird_path }}/.env"
    content: |
      NETBIRD_DOMAIN={{ netbird_domain }}
      NETBIRD_SERVER_VERSION={{ netbird_server_version }}
      NETBIRD_DASHBOARD_VERSION={{ netbird_dashboard_version }}
    mode: '0644'
  tags: [netbird]

- name: "[netbird] Criar dashboard.env"
  template:
    src: "{{ apps_dir }}/netbird/config/dashboard.env.j2"
    dest: "{{ netbird_path }}/dashboard.env"
    mode: '0600'
  tags: [netbird]

- name: "[netbird] Gerar segredos criptográficos (se não fornecidos)"
  set_fact:
    nb_auth_secret: "{{ netbird_auth_secret | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
    nb_session_key: "{{ netbird_session_key if (netbird_session_key is defined and (netbird_session_key | length == 44)) else (netbird_session_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')) | b64encode) }}"
    nb_datastore_key: "{{ netbird_datastore_key if (netbird_datastore_key is defined and (netbird_datastore_key | length == 44)) else (netbird_datastore_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')) | b64encode) }}"
  tags: [netbird]

- name: "[netbird] Criar config.yaml para netbird-server (não sobrescrever se já existir)"
  template:
    src: "{{ apps_dir }}/netbird/config/config.yaml.j2"
    dest: "{{ netbird_path }}/config.yaml"
    force: false
    mode: '0600'
  tags: [netbird]

# O Traefik v3 corta requisições com mais de 60s de leitura, e os streams gRPC e
# WebSocket do NetBird ficam abertos o tempo todo. Se o proxy for resetado pelo
# painel do Coolify, rode esta etapa de novo.
- name: "[netbird] Desligar readTimeout do entrypoint https do Traefik do Coolify"
  replace:
    path: "{{ coolify_proxy_path }}/docker-compose.yml"
    regexp: '^(\s*)(- ["'']?--entrypoints\.https\.address=:443["'']?)\s*$(?![\s\S]*readTimeout=0)'
    replace: '\1\2\n\1- ''--entrypoints.https.transport.respondingTimeouts.readTimeout=0'''
  register: proxy_patch
  when: not netbird_on_caddy
  tags: [netbird]

- name: "[netbird] Recriar coolify-proxy com o ajuste"
  command: docker compose up -d --force-recreate
  args:
    chdir: "{{ coolify_proxy_path }}"
  when: not netbird_on_caddy and proxy_patch is changed
  tags: [netbird]

- name: "[netbird] Abrir porta STUN (3478/udp) no firewall"
  shell: |
    if command -v ufw >/dev/null && ufw status | grep -q active; then ufw allow 3478/udp; fi
    if command -v firewall-cmd >/dev/null && firewall-cmd --state >/dev/null 2>&1; then
      firewall-cmd --permanent --add-port=3478/udp && firewall-cmd --reload
    fi
  changed_when: false
  tags: [netbird]

- name: "[netbird] Publicar netbird.{{ domain }} no Caddy"
  template:
    src: "{{ apps_dir }}/netbird/config/netbird.caddy.j2"
    dest: "{{ caddy_path }}/config/conf.d/netbird.caddy"
    mode: '0644'
  register: netbird_caddy
  when: netbird_on_caddy
  tags: [netbird]

- name: "[netbird] Subir containers do NetBird"
  command: docker compose up -d --force-recreate
  args:
    chdir: "{{ netbird_path }}"
  tags: [netbird]

- name: "[netbird] Recarregar Caddy"
  command: docker exec caddy caddy reload --config /etc/caddy/Caddyfile
  when: netbird_on_caddy and netbird_caddy is changed
  tags: [netbird]
