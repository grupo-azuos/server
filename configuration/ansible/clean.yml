---
- name: Clean / Teardown Server Services
  hosts: all
  become: yes
  vars:
    apps_dir: "{{ playbook_dir }}/../apps"
    coolify_proxy_path: "/data/coolify/proxy"
    netbird_path: "/opt/netbird"
    supabase_path: "/opt/supabase"
    monitoring_path: "/opt/monitoring"
    exporters_path: "/opt/exporters"
    komodo_path: "/opt/komodo"
    komodo_periphery_path: "/opt/komodo-periphery"
    caddy_path: "/opt/caddy"

  tasks:
    # =========================================================================
    # === TÚNEL ===
    # =========================================================================
    - name: "[tunnel] Teardown rota *.homo no prod"
      include_tasks: "{{ apps_dir }}/coolify/ansible/clean.tunnel-prod.yml"
      when: server == 'prod'
      tags: [tunnel]

    # =========================================================================
    # === NETBIRD CLIENT ===
    # =========================================================================
    - name: "[netbird-client] Teardown NetBird Client"
      include_tasks: "{{ apps_dir }}/netbird/ansible/clean.client.yml"
      tags: [netbird-client]

    # =========================================================================
    # === NETBIRD SERVER ===
    # =========================================================================
    - name: "[netbird] Teardown NetBird Server"
      include_tasks: "{{ apps_dir }}/netbird/ansible/clean.server.yml"
      when: server == 'prod'
      tags: [netbird]

    # =========================================================================
    # === SUPABASE ===
    # =========================================================================
    - name: "[supabase] Teardown Supabase"
      include_tasks: "{{ apps_dir }}/supabase/ansible/clean.yml"
      when: server == 'homo'
      tags: [supabase]

    # =========================================================================
    # === MONITORAMENTO ===
    # =========================================================================
    - name: "[monitoring] Teardown Prometheus + Grafana"
      include_tasks: "{{ apps_dir }}/monitoring/ansible/clean.yml"
      when: server == 'ops'
      tags: [monitoring]

    - name: "[exporters] Teardown node-exporter + cAdvisor"
      include_tasks: "{{ apps_dir }}/monitoring/ansible/clean.exporters.yml"
      when: inventory_hostname in groups['monitorados'] | default([])
      tags: [exporters]

    # =========================================================================
    # === KOMODO ===
    # =========================================================================
    - name: "[komodo-periphery] Teardown Komodo Periphery"
      include_tasks: "{{ apps_dir }}/komodo/ansible/clean.periphery.yml"
      when: inventory_hostname in groups['komodo'] | default([])
      tags: [komodo-periphery]

    - name: "[komodo] Teardown Komodo Core"
      include_tasks: "{{ apps_dir }}/komodo/ansible/clean.core.yml"
      when: inventory_hostname in groups['komodo_core'] | default([])
      tags: [komodo]

    # =========================================================================
    # === CADDY ===
    # =========================================================================
    - name: "[caddy] Teardown Caddy"
      include_tasks: "{{ apps_dir }}/caddy/ansible/clean.yml"
      when: inventory_hostname in groups['caddy'] | default([])
      tags: [caddy]
