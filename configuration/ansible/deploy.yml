---
# Rode da raiz do repo, uma etapa por vez (ver README):
#   ansible-playbook configuration/ansible/deploy.yml --tags <etapa>
# Só um servidor: acrescente --limit <servidor> (prod, homo, automacao, crm, internos, monitoramento).
# Os 5 servidores de uma vez (docker, netbird-client, exporters, monitoring, komodo, caddy):
#   ansible-playbook configuration/ansible/deploy.yml --tags servidores
- name: Deploy Server Infrastructure
  hosts: all
  become: yes
  vars:
    apps_dir: "{{ playbook_dir }}/../apps"
    coolify_data_path: "/data/coolify"
    coolify_proxy_path: "/data/coolify/proxy"
    netbird_path: "/opt/netbird"
    supabase_path: "/opt/supabase"
    monitoring_path: "/opt/monitoring"
    exporters_path: "/opt/exporters"
    komodo_path: "/opt/komodo"
    komodo_periphery_path: "/opt/komodo-periphery"
    komodo_version: "2.3.3"
    komodo_mongo_version: "8.0"
    caddy_path: "/opt/caddy"
    caddy_version: "2.11"
    caddy_mode: edge
    caddy_routes: []
    # Porta do Caddy local (homo) no IP do NetBird; 80 e 8080 estão com o Coolify lá
    caddy_tunnel_port: 8088

    netbird_server_version: "0.80.0"
    netbird_dashboard_version: "v2.94.0"
    netbird_domain: "netbird.{{ domain }}"
    # *.homo.<domain> vai (TLS intacto) do prod para o homo
    homo_domain: "homo.{{ domain }}"
    # Faixa de onde o NetBird sorteia a rede da VPN; o homo aceita PROXY protocol só dela.
    vpn_cidr: "100.64.0.0/10"
    # IP do homo na VPN. Vazio = descoberto na etapa tunnel (netbird status no homo).
    homo_vpn_ip: ""

  pre_tasks:
    - name: "Variáveis do servidor (configuration/servers/<servidor>/vars.yml)"
      include_vars: "{{ item }}"
      with_first_found:
        - files: ["{{ playbook_dir }}/../servers/{{ server }}/vars.yml"]
          skip: true
      tags: [always]

  tasks:
    # -------------------------------------------------------------------------
    # Coolify (prod e homo)
    # -------------------------------------------------------------------------
    - name: "[coolify] Deploy Coolify PaaS"
      include_tasks: "{{ apps_dir }}/coolify/ansible/deploy.yml"
      when: server in ['prod', 'homo']
      tags: [coolify]

    # -------------------------------------------------------------------------
    # Docker (servidores sem Coolify)
    # -------------------------------------------------------------------------
    - name: "[docker] Instalar Docker"
      include_tasks: "tasks/docker.yml"
      when: server not in ['prod', 'homo']
      tags: [docker, servidores]

    # -------------------------------------------------------------------------
    # NetBird
    # -------------------------------------------------------------------------
    - name: "[netbird] Deploy NetBird Server"
      include_tasks: "{{ apps_dir }}/netbird/ansible/deploy.server.yml"
      when: server == 'prod'
      tags: [netbird]

    - name: "[netbird-client] Conectar NetBird Client"
      include_tasks: "{{ apps_dir }}/netbird/ansible/deploy.client.yml"
      tags: [netbird-client, servidores]

    # -------------------------------------------------------------------------
    # Supabase self-hosted (homo, /opt/supabase)
    # -------------------------------------------------------------------------
    - name: "[supabase] Deploy Supabase"
      include_tasks: "{{ apps_dir }}/supabase/ansible/deploy.yml"
      when: server == 'homo'
      tags: [supabase]

    # -------------------------------------------------------------------------
    # Túnel *.homo: o homo roda antes, porque o prod precisa do IP dele na VPN
    # -------------------------------------------------------------------------
    - name: "[tunnel] Preparar Traefik do homo"
      include_tasks: "{{ apps_dir }}/coolify/ansible/deploy.tunnel-homo.yml"
      when: server == 'homo'
      tags: [tunnel]

    - name: "[tunnel] Encaminhar *.homo no Traefik do prod"
      include_tasks: "{{ apps_dir }}/coolify/ansible/deploy.tunnel-prod.yml"
      when: server == 'prod'
      tags: [tunnel]

    # -------------------------------------------------------------------------
    # Monitoramento: exporters nos monitorados, Prometheus + Grafana no monitoramento
    # -------------------------------------------------------------------------
    - name: "[exporters] Deploy node-exporter + cAdvisor"
      include_tasks: "{{ apps_dir }}/monitoring/ansible/deploy.exporters.yml"
      when: inventory_hostname in groups['monitorados'] | default([])
      tags: [exporters, servidores]

    - name: "[monitoring] Deploy Prometheus + Grafana"
      include_tasks: "{{ apps_dir }}/monitoring/ansible/deploy.yml"
      when: server == 'monitoramento'
      tags: [monitoring, servidores]

    # -------------------------------------------------------------------------
    # Komodo: Core (painel) no komodo_core, agente em todo servidor do grupo komodo
    # -------------------------------------------------------------------------
    - name: "[komodo] Deploy Komodo Core"
      include_tasks: "{{ apps_dir }}/komodo/ansible/deploy.core.yml"
      when: inventory_hostname in groups['komodo_core'] | default([])
      tags: [komodo, servidores]

    - name: "[komodo-periphery] Deploy Komodo Periphery"
      include_tasks: "{{ apps_dir }}/komodo/ansible/deploy.periphery.yml"
      when: inventory_hostname in groups['komodo'] | default([])
      tags: [komodo-periphery, servidores]

    # -------------------------------------------------------------------------
    # Caddy: borda com TLS ou local atrás da borda (servers/<servidor>/vars.yml)
    # -------------------------------------------------------------------------
    - name: "[caddy] Deploy Caddy"
      include_tasks: "{{ apps_dir }}/caddy/ansible/deploy.yml"
      when: inventory_hostname in groups['caddy'] | default([])
      tags: [caddy, servidores]
