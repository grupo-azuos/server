# Os hosts.ini usam o grupo [servers] (mesmo formato do my-config). Aqui a
# variável `server=` de cada linha vira um grupo com o mesmo nome, usado pelo
# deploy.yml e pelo --limit.
plugin: ansible.builtin.constructed
strict: true
groups:
  prod: server == 'prod'
  homo: server == 'homo'
  auto: server == 'auto'
  crm: server == 'crm'
  core: server == 'core'
  ops: server == 'ops'
  # Servidores com node-exporter + cAdvisor, coletados pelo Prometheus do ops.
  # Para monitorar o prod também, acrescente 'prod' na lista.
  monitorados: server in ['homo', 'auto', 'crm', 'core', 'ops']
  # Komodo: o painel (Core) roda num servidor só; o agente (Periphery), em todos do grupo komodo.
  komodo_core: server == 'ops'
  komodo: server in ['homo', 'auto', 'crm', 'core', 'ops']
  # Caddy em todos; o modo (borda ou local) fica no vars.yml de cada um.
  caddy: server in ['homo', 'auto', 'crm', 'core', 'ops']
  # Cockpit (painel do sistema, só pela VPN) nos servidores da DigitalOcean.
  cockpit: server in ['ops', 'core', 'crm', 'auto']
