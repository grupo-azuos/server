# Variáveis não secretas do servidor ops, carregadas pelo deploy.yml.
# Segredos ficam no hosts.ini.

caddy_mode: edge

# Nomes publicados pelo Caddy deste servidor. Cada rota tem `hosts` e um destino:
#   upstream: <container>:<porta>   app na rede docker `caddy` deste servidor
#   server: <nome>                  repassa pela VPN ao Caddy daquele servidor (modo local)
#   path: /x/*                      (opcional) publica só esse caminho; o resto responde 404
#   vpn_only: true                  (opcional) só quem está no NetBird
#   public_path: /x/*               (opcional, com vpn_only) esse caminho fica público
#   tls_insecure: true              (opcional) destino HTTPS com certificado autoassinado
caddy_routes:
  # Painel só na VPN; os webhooks do GitHub (/listener) ficam públicos
  - hosts: ["komodo.{{ domain }}"]
    upstream: komodo-core:9120
    vpn_only: true
    public_path: /listener/*
  - hosts: ["grafana.{{ domain }}"]
    upstream: "{{ vpn_ip }}:3000"
    vpn_only: true
  - hosts: ["prometheus.{{ domain }}"]
    upstream: "{{ vpn_ip }}:9090"
    vpn_only: true
  - hosts: ["cockpit-ops.{{ domain }}"]
    upstream: "https://{{ vpn_ip }}:{{ cockpit_port }}"
    tls_insecure: true
    vpn_only: true
  # Homologação: a borda emite o certificado e repassa pela VPN ao Caddy do homo
  # - hosts: ["app.homo.{{ domain }}"]
  #   server: homo

# Link de webhook que o Komodo sugere nos stacks
komodo_host: "https://komodo.{{ domain }}"
