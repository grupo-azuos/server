[defaults]
# Todos os servidores juntos: a etapa "tunnel" precisa ver prod e homo, e a "monitoring" todos os monitorados.
# Um hosts.ini que ainda não existe só gera um aviso.
inventory = configuration/servers/v1.0.0/prod/hosts.ini,configuration/servers/v1.0.0/homo/hosts.ini,configuration/servers/v1.0.1/auto/hosts.ini,configuration/servers/v1.0.1/crm/hosts.ini,configuration/servers/v1.0.1/core/hosts.ini,configuration/servers/v1.0.1/ops/hosts.ini,configuration/servers/groups.yml
host_key_checking = False
deprecation_warnings = False
interpreter_python = auto_silent

[ssh_connection]
ssh_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
