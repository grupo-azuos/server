[defaults]
# Os dois servidores juntos: a etapa "tunnel" precisa ver prod e homo na mesma execução.
inventory = configuration/servers/prod/hosts.ini,configuration/servers/homo/hosts.ini,configuration/servers/groups.yml
host_key_checking = False
deprecation_warnings = False
interpreter_python = auto_silent

[ssh_connection]
ssh_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
